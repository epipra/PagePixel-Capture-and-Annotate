<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PagePixel — Popup (mock)</title>
<style>
  html, body {
    margin: 0; width: 1280px; height: 800px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0b1f33 0%, #114a5c 55%, #1a7a8a 100%);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 90px;
    box-sizing: border-box;
  }
  .pp-copy { color: #fff; max-width: 480px; }
  .pp-copy h1 { font-size: 44px; line-height: 1.15; margin: 0 0 18px; font-weight: 800; }
  .pp-copy p { font-size: 19px; line-height: 1.5; color: #cfe4e8; margin: 0 0 28px; }
  .pp-badges { display: flex; gap: 14px; }
  .pp-badge {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
  }
  .pp-browser {
    width: 620px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    background: #e9edef;
  }
  .pp-browser__bar {
    height: 42px; background: #dfe4e6; display: flex; align-items: center; gap: 8px; padding: 0 16px;
  }
  .pp-dot { width: 12px; height: 12px; border-radius: 50%; }
  .pp-browser__url {
    margin-left: 14px; background: #fff; border-radius: 6px; padding: 6px 14px; font-size: 13px; color: #6b7c85; flex: 1;
  }
  .pp-browser__body { position: relative; background: #fff; height: 480px; }
  .pp-popup-anchor {
    position: absolute; top: 16px; right: 20px;
    box-shadow: 0 16px 40px rgba(11,31,51,0.35);
    border-radius: 12px; overflow: hidden;
  }
  iframe { border: none; display: block; }
  .pp-page-hint { position: absolute; top: 100px; left: 40px; right: 300px; color: #9fb0b8; }
  .pp-page-hint .bar { height: 14px; background: #eef2f3; border-radius: 6px; margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="pp-copy">
    <h1>Capture, annotate, and export any page — in one click.</h1>
    <p>Visible area, full page, or a hand-picked region. Then draw, blur, and export as PNG, JPEG, WEBP, or PDF — no data ever leaves your browser.</p>
    <div class="pp-badges">
      <span class="pp-badge">Full-page stitching</span>
      <span class="pp-badge">Built-in editor</span>
      <span class="pp-badge">100% local</span>
    </div>
  </div>

  <div class="pp-browser">
    <div class="pp-browser__bar">
      <span class="pp-dot" style="background:#ff5f57"></span>
      <span class="pp-dot" style="background:#febc2e"></span>
      <span class="pp-dot" style="background:#28c840"></span>
      <span class="pp-browser__url">example.com/dashboard</span>
    </div>
    <div class="pp-browser__body">
      <div class="pp-page-hint">
        <div class="bar" style="width:70%"></div>
        <div class="bar" style="width:90%"></div>
        <div class="bar" style="width:55%"></div>
        <div class="bar" style="width:80%; margin-top:30px;"></div>
        <div class="bar" style="width:60%"></div>
      </div>
      <div class="pp-popup-anchor">
        <iframe src="../../../popup/popup.html" width="320" height="420" scrolling="no"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
