<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PagePixel</title>
<link rel="stylesheet" href="../styles/theme.css" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="pp-header">
    <img class="pp-logo" src="../icons/icon32.png" alt="" width="24" height="24" />
    <span class="pp-title">PagePixel</span>
  </header>

  <main class="pp-main">
    <fieldset class="pp-modes">
      <legend>Capture mode</legend>
      <label class="pp-radio">
        <input type="radio" name="mode" value="visible" checked />
        <span>
          <strong>Visible Area</strong>
          <small>Capture just what's on screen</small>
        </span>
      </label>
      <label class="pp-radio">
        <input type="radio" name="mode" value="fullpage" />
        <span>
          <strong>Full Page</strong>
          <small>Auto-scroll and stitch the entire page</small>
        </span>
      </label>
      <label class="pp-radio">
        <input type="radio" name="mode" value="selection" />
        <span>
          <strong>Selected Area</strong>
          <small>Drag to choose a region</small>
        </span>
      </label>
    </fieldset>

    <div class="pp-options">
      <label class="pp-field" for="delay">
        <span>Delay before capture (ms)</span>
        <input type="number" id="delay" min="0" max="5000" step="50" value="150" />
      </label>

      <label class="pp-checkbox" id="bottomToTopWrap">
        <input type="checkbox" id="bottomToTop" />
        <span>Capture bottom to top <small>(fixes some full-page stitching issues)</small></span>
      </label>
    </div>

    <button type="button" id="captureBtn" class="pp-capture-btn">Capture</button>
    <p id="status" class="pp-status" role="status" aria-live="polite"></p>
  </main>

  <footer class="pp-footer">
    <a href="#" id="helpLink">Help</a>
    <span class="pp-dot">·</span>
    <span>Developed by AdxFuel</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
